<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fritz Laplage Shopping</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <!-- LEFT SIDE -->
        <aside class="sidebar">

            <div class="logo-container">
                <img src="assets/images/logo/fls1.png" alt="Fritz Laplage Shopping logo">
            </div>

            <p class="photo-credit">
                Photo by Fritz Fun on TikTok
            </p>

        </aside>


        <!-- RIGHT SIDE -->
        <main class="content">

            <section class="intro">
                <h1>Welcome to Fritz Laplage Shopping.</h1>

                <p>
                    Create your account and discover our latest
                    collections, fashion pieces and accessories.
                </p>
            </section>


            <section class="form-section">

                <h2>Let's get started!</h2>

                <form>

                    <div class="form-row">

                        <div class="form-field">
                            <label for="first-name">First Name</label>
                            <input type="text" id="first-name" name="first-name" required>
                        </div>

                        <div class="form-field">
                            <label for="last-name">Last Name</label>
                            <input type="text" id="last-name" name="last-name" required>
                        </div>


                    </div>

                    <div class="form-row">

                        <div class="form-field">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-field">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>

                    </div>

                    <div class="form-row">

                        <div class="form-field">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                        </div>

                        <div class="form-field">
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password" id="confirm-password" name="confirm-password" required>
                        </div>

                    </div>

                    <button type="submit">
                        Create Account
                    </button>

                </form>

            </section>


            <p class="login">
                Already have an account?
                <a href="#">Log in</a>
            </p>

        </main>

    </div>

</body>

</html>
